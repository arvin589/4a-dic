<style>
/* Layout: iOS-like tab app — stacked screens over a fixed bottom tab bar */
:root{

  --der:#2563eb; --die:#d62f2f; --das:#139a43; --good:#16a34a; --bad:#dc2626;

  --font:"Vazirmatn",system-ui,-apple-system,Tahoma,sans-serif;
}

  --bg:#0e1014; --card:#181b21; --card2:#22262e; --fg:#eceef2; --muted:#9299a5; --line:#2b2f38;

  --der:#60a5fa; --die:#f87171; --das:#4ade80; --good:#22c55e; --bad:#ef4444;
  --g1a:#4338ca; --g1b:#1d4ed8; --g2a:#0f766e; --g2b:#15803d; --tok:rgba(45,212,191,.17); color-scheme:dark}}
:root[data-theme="dark"]{

  --der:#60a5fa; --die:#f87171; --das:#4ade80; --good:#22c55e; --bad:#ef4444;
  --g1a:#4338ca; --g1b:#1d4ed8; --g2a:#0f766e; --g2b:#15803d; --tok:rgba(45,212,191,.17); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--font);overflow:hidden}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;bottom:var(--tabh,64px);display:flex;flex-direction:column;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px)}
.screen.full{bottom:0;z-index:20}
.nav{display:flex;align-items:center;gap:8px;min-height:50px}
.nav h1{font-size:22px;margin:0;flex:1;font-weight:800}
.nav.small h1{font-size:17px;text-align:center}
.nav .side{min-width:64px;display:flex;gap:6px}
.nav .side.end{justify-content:flex-end}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:28px;min-height:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;direction:ltr;background:var(--card);border-top:1px solid var(--line);z-index:10}
.tabbar button{flex:1;border:0;background:none;color:var(--muted);font:12px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--accent);font-weight:700}
input,textarea,select{font:inherit;color:var(--fg)}
.search{width:100%;padding:10px 14px;border-radius:12px;border:0;background:var(--card2)}
.field{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.ltr{direction:ltr;text-align:left}
.group{background:var(--card);border-radius:14px;overflow:hidden;margin:12px 0}
.ghead{font-size:13px;color:var(--muted);margin:16px 6px 4px}
.gfoot{font-size:12px;color:var(--muted);margin:4px 6px 0}
.cell{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);min-width:0}
.cell:last-child{border-bottom:0}
.cell.tap{cursor:pointer}
.cell .grow{flex:1;min-width:0}
.chev{color:var(--muted);font-size:18px}
.row{direction:ltr;display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.row .de{direction:ltr;text-align:left;flex:1;min-width:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .fa{direction:rtl;color:var(--muted);text-align:right;max-width:46%;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{color:var(--plural)}
.art-der{color:var(--der)}.art-die{color:var(--die)}.art-das{color:var(--das)}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.listwrap{position:relative;flex:1;min-height:0;display:flex}
.listwrap .scroll{padding-right:24px}
.alpha{position:absolute;right:-8px;top:0;bottom:0;width:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;font:700 11px/1.35 system-ui;color:var(--accent);touch-action:none;user-select:none;z-index:3}
.sect{position:sticky;top:0;background:var(--bg);color:var(--muted);font-weight:700;font-size:13px;padding:6px 2px 2px;z-index:1;direction:ltr;text-align:left}
.btn{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line)}
.btn.red{background:var(--bad)}.btn.green{background:var(--good)}
.btn.sm{padding:6px 12px;font-size:13px}
.link{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:4px}
.link.red{color:var(--bad)}
.icon{border:0;background:var(--accent-soft);color:var(--accent);width:38px;height:38px;border-radius:50%;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center}
.icon svg{width:20px;height:20px}
.plus{border:0;background:none;cursor:pointer;color:var(--accent);padding:0;display:inline-flex}
.plus svg{width:28px;height:28px}
.plus.orange{color:var(--orange)}
.hero{border:0;width:100%;text-align:right;color:#fff;border-radius:22px;padding:20px;min-height:120px;display:flex;align-items:center;gap:16px;cursor:pointer;font:inherit;margin-top:14px}
.hero .t{font-size:22px;font-weight:800}
.hero .s{opacity:.9;font-size:14px}
.hero svg{width:42px;height:42px;flex:none}
.hero.a{background:linear-gradient(135deg,var(--g1a),var(--g1b))}
.hero.b{background:linear-gradient(135deg,var(--g2a),var(--g2b))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.stat{background:var(--card);border-radius:16px;padding:14px 4px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}
.headcard{background:var(--accent-soft);border-radius:20px;padding:22px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.headcard .w{font-size:34px;font-weight:800;direction:ltr;line-height:1.25;word-break:break-word}
.pos{font-size:12px;font-weight:700;background:rgba(20,184,166,.2);padding:2px 10px;border-radius:999px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px}
.tabs button{flex:none;border:0;border-radius:12px;padding:8px 12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;text-align:center}
.tabs button small{display:block;font-size:11px;opacity:.8}
.tabs button.on{background:var(--accent);color:#fff}
.sense{margin:14px 0 6px}
.sense b{font-size:21px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 10px;border-radius:10px;font-size:14px;background:var(--card);direction:ltr}
.chip.blue{background:rgba(37,99,235,.12);color:var(--der)}
.box{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
.sub{color:var(--muted);font-size:13px}
.ex{background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0}
.deline{direction:ltr;text-align:left;display:flex;gap:8px;align-items:flex-start}
.deline .toks{flex:1;min-width:0}
.tok{display:inline-block;padding:1px 4px;margin:1px;border-radius:6px;background:var(--tok);cursor:pointer}
.ex .fa{color:var(--muted);font-size:14px;margin-top:4px}
.ex .ph{color:var(--orange);font-size:12px}
.tokcard{position:fixed;z-index:40;left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:86%}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92%;overflow-y:auto}
.sheet h3{margin:0 0 8px;font-size:17px;text-align:center}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font:13px var(--font);color:var(--fg);cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:700}
.stepper{display:flex;gap:6px}
.stepper button{width:36px;height:32px;border:0;border-radius:8px;background:var(--card2);color:var(--fg);font-size:18px;cursor:pointer}
.switch{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--card2);position:relative;cursor:pointer;flex:none}
.switch:checked{background:var(--good)}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.switch:checked::after{right:21px}
.progress{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.flash{background:var(--card);border-radius:20px;padding:22px 14px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;cursor:pointer;margin-top:14px}
.flash hr{width:80%;border:0;border-top:1px solid var(--line)}
.ver{text-align:center;color:var(--muted);font-size:15px;line-height:1.7;margin-top:20px;padding:0 8px}
.ver b{font-size:16px;color:var(--text,inherit)}
.empty{color:var(--muted);padding:16px 4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

// ---------- text
function fold(s){
  let t = String(s||'').replace(/ß/g,'ss').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[‌‍]/g,'');
  t = t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  return t.replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u').trim();
}

function germanHTML(w, withPlural){
  const art = w.article ? `<span class="${artCls(w.article)}">${esc(w.article)}</span> ` : '';
  let pl = '';
  if (withPlural && w.plural) {
    if (w.plural.toLowerCase().startsWith(w.de.toLowerCase())) {
      const rest = w.plural.slice(w.de.length);
      if (rest) pl = ` <span class="pl">-${esc(rest)}</span>`;
    } else pl = ` <span class="pl">⟶ ${esc(w.plural)}</span>`;
  }
  return art + esc(w.de) + pl;
}

// ---------- index
let ALL, BY_ID, IDX, FORM, ALPHA;
function rebuild(){
  ALL = SEED.concat(userWords);
  BY_ID = new Map(); for (const w of ALL) if (!BY_ID.has(w.id)) BY_ID.set(w.id, w);
  IDX = ALL.map(w => ({w, de: fold(w.de), fa: fold([w.fa, ...(w.senses||[]).map(s=>s.fa)].join(' '))}));
  FORM = new Map();
  for (const w of ALL) {
    const k = fold(w.de); if (!FORM.has(k)) FORM.set(k, w);
    for (const f of (w.forms||[])) { const i = f.indexOf(':'); if (i<0) continue; const v = fold(f.slice(i+1)); if (v && !FORM.has(v)) FORM.set(v, w); }
    if (w.plural) { const p = fold(w.plural); if (!FORM.has(p)) FORM.set(p, w); }
  }
  const g = new Map();
  for (const it of IDX) { const c = it.de.charAt(0).toUpperCase(); const k = (c>='A'&&c<='Z') ? c : '#'; if (!g.has(k)) g.set(k, []); g.get(k).push(it); }
  ALPHA = [...g.keys()].sort((a,b)=> a==='#'?1 : b==='#'?-1 : a<b?-1:1).map(k => [k, g.get(k).sort((a,b)=> a.de<b.de?-1:a.de>b.de?1:0).map(x=>x.w)]);
}
rebuild();

function search(q){
  const f = fold(q); if (!f) return [];
  const out = [];
  for (const it of IDX) {
    let s = null;
    if (it.de === f) s = 0; else if (it.de.startsWith(f)) s = 1; else if (it.de.includes(f)) s = 2;
    else if (it.fa === f) s = 0; else if (it.fa.startsWith(f)) s = 1; else if (it.fa.includes(f)) s = 3;
    if (s !== null) out.push([s, it.w]);
  }
  out.sort((a,b) => a[0]-b[0] || a[1].de.localeCompare(b[1].de,'de',{sensitivity:'base'}));
  return out.slice(0,200).map(x=>x[1]);
}
function exactWord(t){
  const f = fold(t); if (!f) return null;
  const a = IDX.find(it => it.de === f); if (a) return a.w;
  const b = IDX.find(it => fold(it.w.fa) === f); return b ? b.w : null;
}
function lookupToken(raw){
  const t = raw.replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'');
  const low = t.toLowerCase();
  if (GLOSS[low]) return {token:t, fa:GLOSS[low], word: FORM.get(fold(t)) || null};
  const f = fold(t);
  if (FORM.has(f)) { const w = FORM.get(f); return {token:t, fa:w.fa, word:w}; }
  for (const sfx of ['e','en','er','es','em','n','s','te','st','et','ten','t']) {
    if (f.endsWith(sfx) && f.length > sfx.length+1) {
      const st = f.slice(0,-sfx.length);
      const w = FORM.get(st) || FORM.get(st+'en') || FORM.get(st+'n');
      if (w) return {token:t, fa:w.fa, word:w};
    }
  }
  if (f.startsWith('ge') && f.endsWith('t')) { const w = FORM.get(f.slice(2,-1)+'en'); if (w) return {token:t, fa:w.fa, word:w}; }
  return {token:t, fa:null, word:null};
}
function recordSearch(t){
  t = String(t||'').trim(); if (!t) return;
  const f = fold(t);
  recent = [t, ...recent.filter(x => fold(x) !== f)].slice(0,20); save('recent', recent);
}

function dueWords(limit){
  return dueIDs().sort((a,b)=> cards[a].box-cards[b].box || cards[a].due-cards[b].due).slice(0,limit).map(id=>BY_ID.get(id));

function answer(id, ok){
  const c = cards[id]; if (!c) return;
  c.last = Date.now();
  if (ok) { if (c.box >= 5) { c.box = 5; c.learned = true; } else c.box++; c.due = dayOffset(INTERVALS[c.box-1]); }
  else { c.box = 1; c.learned = false; c.due = dayOffset(INTERVALS[0]); }
  save('cards', cards);
}

function bestVoice(){
  if (voiceName) { const v = voices.find(x => x.name === voiceName); if (v) return v; }
  for (const n of ['Markus','Yannick','Viktor','Martin','Reed']) { const v = voices.find(x => x.name.includes(n)); if (v) return v; }

  if (!('speechSynthesis' in window)) return toast('این مرورگر تلفظ ندارد');

  const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; u.rate = .95;

}

function renderTabbar(){
  const tabs = [['dict','واژه‌نامه',I.book],['home','خانه',I.home],['leit','لایتنر',I.stack]];

function render(){
  renderTabbar();
  const app = $('#app');
  const top = stack[stack.length-1];
  let html, bind;
  if (top) { html = `<section class="screen${top.full?' full':''}">${top.render()}</section>`; bind = top.bind; }
  else if (state.tab === 'home') { html = `<section class="screen">${homeHTML()}</section>`; bind = bindHome; }
  else if (state.tab === 'dict') { html = `<section class="screen">${dictHTML()}</section>`; bind = bindDict; }
  else { html = `<section class="screen">${leitHTML()}</section>`; bind = bindLeit; }
  $('#tabbar').hidden = !!(top && top.full);
  app.innerHTML = html;
  const scr = app.firstElementChild;
  scr.querySelectorAll('[data-back]').forEach(b => b.onclick = pop);
  bind && bind(scr);
}

function openDictMenu(){ sheet(`<h3>واژه‌نامه</h3><div class="group">
      <div class="cell tap" id="mAdd"><span class="grow">افزودن واژه</span><span class="chev">‹</span></div>

      <div class="gfoot">ستون‌های CSV: آلمانی، فارسی، حرف تعریف، جمع، مثال (جداکننده: کاما، سمی‌کالن یا Tab)</div>
      <button class="btn ghost block" id="mClose" style="margin-top:10px">بستن</button>`, s => {
    s.querySelector('#mAdd').onclick = () => { closeSheet(); openAddWord(''); };
    s.querySelector('#mSites').onclick = () => { closeSheet(); push(sitesScreen()); };
    s.querySelector('#mClose').onclick = closeSheet;
    s.querySelector('#csvIn').onchange = ev => {
      const f = ev.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { const n = importCSV(String(r.result)); closeSheet(); alertSheet(`${n} واژه‌ی جدید اضافه شد.`); };
      r.onerror = () => { closeSheet(); alertSheet('فایل خوانده نشد. فایل باید با کدگذاری UTF-8 ذخیره شده باشد.'); };
      r.readAsText(f, 'utf-8');
    };
  });
}
function bindAlpha(el, list){
  const alpha = el.querySelector('#alpha');
  if (alpha) {
    const go = y => {
      const r = alpha.getBoundingClientRect(); const kids = alpha.children;
      const first = kids[0].getBoundingClientRect(), last = kids[kids.length-1].getBoundingClientRect();
      const i = Math.max(0, Math.min(kids.length-1, Math.floor((y - first.top) / ((last.bottom - first.top) / kids.length))));
      const sec = el.querySelector('#sec-' + kids[i].dataset.k);
      if (sec && list) { list.scrollTop = sec.offsetTop - list.offsetTop; state.scroll.dict = list.scrollTop; }
    };
    let drag = false;
    alpha.addEventListener('pointerdown', e => { drag = true; try { alpha.setPointerCapture(e.pointerId); } catch(_){} go(e.clientY); e.preventDefault(); });
    alpha.addEventListener('pointermove', e => { if (drag) go(e.clientY); });
    alpha.addEventListener('pointerup', () => drag = false);
    alpha.addEventListener('pointercancel', () => drag = false);
  }
}
function importCSV(text){
  let added = 0;
  const lines = text.replace(/\r\n?/g,'\n').split('\n').filter(Boolean);
  lines.forEach((line, i) => {
    const sep = line.includes('\t') ? '\t' : line.includes(';') ? ';' : ',';
    const cols = line.split(sep).map(c => c.replace(/^[\s"]+|[\s"]+$/g,''));
    if (cols.length < 2) return;
    const [de, fa] = cols; if (!de || !fa) return;
    if (i === 0 && de.toLowerCase() === 'de') return;
    const article = cols[2] && ['der','die','das'].includes(cols[2].toLowerCase()) ? cols[2].toLowerCase() : null;
    const w = {id: makeID(article, de), de, article, plural: cols[3] || null, pos: article ? 'n' : 'other', fa, example: cols[4] || null, tags:['user']};
    if (!BY_ID.has(w.id)) { userWords.push(w); BY_ID.set(w.id, w); added++; }
  });
  if (added) { save('userWords', userWords); rebuild(); }
  return added;
}

    },
    bind: el => {
      el.querySelectorAll('[data-si]').forEach(b => b.onclick = () => { si = +b.dataset.si; render(); });
      el.querySelectorAll('[data-syn]').forEach(b => b.onclick = () => { const x = exactWord(b.dataset.syn); if (x) openWord(x); else { state.query = b.dataset.syn; setTab('dict'); } });
      const a = el.querySelector('#addL'); if (a) a.onclick = () => { addLeit(w); toast('به لایتنر اضافه شد'); render(); };
      const r = el.querySelector('#remL'); if (r) r.onclick = () => { removeLeit(w.id); toast('از لایتنر حذف شد'); render(); };
      const d = el.querySelector('#delUser'); if (d) d.onclick = () => confirmSheet('این واژه از واژه‌نامه حذف شود؟', 'حذف', () => { userWords = userWords.filter(x => x.id !== w.id); save('userWords', userWords); removeLeit(w.id); rebuild(); pop(); });
    }
  });
}
function exHTML(e){
  const toks = e.de.split(/(\s+)/).map(p => /\p{L}/u.test(p) ? `<span class="tok" data-t="${esc(p)}">${esc(p)}</span>` : esc(p)).join('');
  return `<div class="ex"><div class="deline"><span class="toks">${toks}</span>${speakBtn(e.de)}</div><div class="fa">${esc(e.fa)}</div>${e.ph?`<div class="ph">تلفظ: ${esc(e.ph)}</div>`:''}</div>`;
}
function showToken(t){
  const r = lookupToken(t), card = $('#tokcard');
  const canAdd = r.word && !boxOf(r.word.id);
  card.innerHTML = `<div style="display:flex;align-items:center;gap:8px"><b class="ltr" style="font-size:19px">${esc(r.token)}</b>${speakBtn(r.token)}<span style="flex:1"></span><button class="link" id="tkX" aria-label="بستن" style="font-size:20px">✕</button></div>
    <div style="margin-top:6px">${r.fa ? esc(r.fa) : '<span class="sub">معنی این کلمه در واژه‌نامه نیست.</span>'}</div>
    ${r.word ? `<div class="sub ltr" style="margin-top:2px">${esc(display(r.word))} · <span dir="rtl">${esc(r.word.fa)}</span></div>` : ''}
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">${r.word ? `<button class="btn ghost sm" id="tkOpen">صفحه‌ی واژه</button>` : ''}${canAdd ? `<button class="btn sm" id="tkAdd">افزودن «${esc(display(r.word))}» به لایتنر</button>` : ''}</div>`;
  card.hidden = false;
  card.querySelector('#tkX').onclick = hideTok;
  const o = card.querySelector('#tkOpen'); if (o) o.onclick = () => { hideTok(); openWord(r.word); };
  const a = card.querySelector('#tkAdd'); if (a) a.onclick = () => { addLeit(r.word); toast('به لایتنر اضافه شد'); showToken(t); };
}

// ---------- LEITNER
function leitHTML(){
  const due = dueIDs().length, total = Object.keys(cards).length, lg = tagged('langeek').length;
  const v = bestVoice();
  const counts = [1,2,3,4,5].map(b => Object.keys(cards).filter(id => cards[id].box === b && BY_ID.has(id)).length);
  return `<div class="nav"><h1>جعبه لایتنر</h1></div>
  <div class="scroll">
    <div class="group" style="padding:14px">
      <div style="font-weight:700;font-size:16px">امروز ${Math.min(due, dailyLimit)} کارت برای مرور داری</div>
      <div class="sub">کل کارت‌ها: ${total} — یادگرفته‌شده: ${learnedCount()}</div>
      <button class="btn block" id="startRev" style="margin-top:10px" ${due?'':'disabled'}>${I.play} شروع مرور</button>
    </div>
    <div class="ghead">جعبه‌ها</div>
    <div class="group">${[1,2,3,4,5].map(b => `<div class="cell tap" data-box="${b}"><span class="grow">جعبه ${b}</span><span class="sub">هر ${INTERVALS[b-1]} روز</span><b style="min-width:30px;text-align:center">${counts[b-1]}</b><span class="chev">‹</span></div>`).join('')}</div>
    <div class="group"><div class="cell tap" id="addLg" style="color:var(--accent)"><span class="grow">افزودن همه‌ی واژه‌های لنگیک (${lg}) به لایتنر</span></div></div>
    <div class="gfoot">هر روز فقط به اندازه‌ی «حداکثر کارت در هر روز» برای مرور نشان داده می‌شود.</div>
    <div class="ghead">تنظیمات</div>
    <div class="group">
      <div class="cell"><span class="grow">حداکثر کارت در هر روز: <b>${dailyLimit}</b></span><div class="stepper"><button id="dlMinus" aria-label="کمتر">−</button><button id="dlPlus" aria-label="بیشتر">+</button></div></div>
      <div class="cell"><span style="flex:none">جهت مرور</span><div class="seg grow" id="dir"><button data-r="0" class="${!reverse?'on':''}">آلمانی ← فارسی</button><button data-r="1" class="${reverse?'on':''}">فارسی ← آلمانی</button></div></div>
      <div class="cell"><span style="flex:none">صدای تلفظ</span><select class="field grow ltr" id="voiceSel" style="padding:6px 8px">
        <option value="">خودکار (مردانه)</option>${voices.map(x => `<option value="${esc(x.name)}" ${x.name===voiceName?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="cell" style="display:block"><div style="font-weight:700;font-size:13px">صدای فعال: <span class="ltr" style="display:inline-block">${esc(v ? v.name : '—')}</span></div>
        <div class="sub" style="font-size:12px">${voices.length ? 'صداهای آلمانی همین دستگاه استفاده می‌شوند. برای صدای طبیعی‌تر در آیفون: تنظیمات ← دسترس‌پذیری ← محتوای گفتاری ← صداها ← Deutsch ← Markus یا Yannick (Enhanced یا Premium) را دانلود کن و صفحه را دوباره باز کن.' : 'این مرورگر صدای آلمانی ندارد یا هنوز بارگذاری نشده است.'}</div></div>
      <div class="cell"><span class="grow">امتحان صدا</span>${speakBtn('Guten Tag! Wie geht es Ihnen?')}</div>
      <div class="cell tap" id="resetL" style="color:var(--bad)">پاک کردن کل لایتنر</div>
    </div>
    <div class="ghead">پشتیبان‌گیری</div>
    <div class="group">
      <div class="cell tap" id="bkOut" style="color:var(--accent)"><span class="grow">کپی پشتیبان (لایتنر و واژه‌های من)</span></div>
      <div class="cell tap" id="bkIn" style="color:var(--accent)"><span class="grow">بازیابی از متن پشتیبان</span></div>
    </div>
    <div class="gfoot">پیشرفت فقط در همین مرورگر ذخیره می‌شود. برای انتقال به دستگاه دیگر یا قبل از پاک کردن داده‌های مرورگر، پشتیبان را کپی و جایی نگه دار.</div>
  </div>`;
}
function bindLeit(el){
  el.querySelector('#startRev').onclick = () => startReview();
  el.querySelectorAll('[data-box]').forEach(c => c.onclick = () => push(boxScreen(+c.dataset.box)));
  el.querySelector('#addLg').onclick = () => {
    let n = 0; for (const w of tagged('langeek')) if (!cards[w.id]) { cards[w.id] = {box:1, due:Date.now(), learned:false}; n++; }
    if (n) save('cards', cards);
    render(); alertSheet(n === 0 ? 'همه‌ی واژه‌های لنگیک از قبل در لایتنر هستند.' : `${n} کارت به جعبه ۱ اضافه شد.`);
  };
  el.querySelector('#dlMinus').onclick = () => { dailyLimit = Math.max(5, dailyLimit-5); save('dailyLimit', dailyLimit); render(); };
  el.querySelector('#dlPlus').onclick = () => { dailyLimit = Math.min(100, dailyLimit+5); save('dailyLimit', dailyLimit); render(); };
  el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { reverse = b.dataset.r === '1'; save('reverse', reverse); render(); });
  el.querySelector('#voiceSel').onchange = e => { voiceName = e.target.value; save('voiceName', voiceName); render(); };
  el.querySelector('#resetL').onclick = () => confirmSheet('همه‌ی کارت‌ها و پیشرفت پاک می‌شود. مطمئنی؟', 'پاک کردن', () => { cards = {}; save('cards', cards); render(); });
  el.querySelector('#bkOut').onclick = async () => {
    const txt = JSON.stringify({app:'4A-dic', v:1, cards, userWords});
    try { await navigator.clipboard.writeText(txt); toast('پشتیبان کپی شد'); }
    catch(e){ sheet(`<h3>متن پشتیبان</h3><textarea class="field ltr" rows="6" id="bkTa" readonly>${esc(txt)}</textarea><div class="gfoot">متن را انتخاب و کپی کن.</div><button class="btn block" id="bkC" style="margin-top:8px">بستن</button>`, s => { const ta = s.querySelector('#bkTa'); ta.focus(); ta.select(); s.querySelector('#bkC').onclick = closeSheet; }); }
  };
  el.querySelector('#bkIn').onclick = () => sheet(`<h3>بازیابی پشتیبان</h3><textarea class="field ltr" rows="6" id="bkTa" placeholder="متن پشتیبان را اینجا بچسبان"></textarea>
    <div class="gfoot">لایتنر و واژه‌های فعلی با محتوای پشتیبان جایگزین می‌شوند.</div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="bkGo" style="flex:1">بازیابی</button><button class="btn ghost" id="bkC" style="flex:1">انصراف</button></div>`, s => {
    s.querySelector('#bkC').onclick = closeSheet;
    s.querySelector('#bkGo').onclick = () => {
      try { const d = JSON.parse(s.querySelector('#bkTa').value); if (!d || typeof d.cards !== 'object') throw 0;
        cards = d.cards; userWords = Array.isArray(d.userWords) ? d.userWords : userWords; save('cards', cards); save('userWords', userWords); rebuild(); closeSheet(); toast('بازیابی شد'); render();
      } catch(e){ toast('متن پشتیبان معتبر نیست'); }
    };
  });
}
function boxScreen(b){
  return {
    render: () => {
      const ws = Object.keys(cards).filter(id => cards[id].box === b && BY_ID.has(id)).map(id => BY_ID.get(id)).sort((x,y)=>x.de.localeCompare(y.de,'de',{sensitivity:'base'}));
      return `<div class="nav small"><div class="side"><button class="link" data-back>‹ بازگشت</button></div><h1>جعبه ${b}</h1><div class="side"></div></div>
        <div class="scroll">${ws.length ? `<div class="group">${ws.map(w => `<div class="cell"><div class="grow tap" data-word="${esc(w.id)}" style="cursor:pointer"><div class="ltr" style="font-weight:700">${germanHTML(w, true)}</div><div class="sub">${esc(w.fa)}</div></div><button class="link red" data-noopen data-rm="${esc(w.id)}">حذف</button></div>`).join('')}</div>` : '<div class="empty">این جعبه خالی است.</div>'}</div>`;
    },
    bind: el => el.querySelectorAll('[data-rm]').forEach(x => x.onclick = e => { e.stopPropagation(); removeLeit(x.dataset.rm); render(); })
  };
}
function startReview(){
  const queue = dueWords(dailyLimit);
  let i = 0, flipped = false, right = 0;
  push({
    full: true,
    render: () => {
      if (i >= queue.length) return `<div class="nav small"><div class="side"><button class="link" data-back>بستن</button></div><h1>مرور</h1><div class="side"></div></div>
        <div class="scroll" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center"><span style="color:var(--good)">${I.check}</span>
        <div style="font-size:22px;font-weight:800">${queue.length ? 'مرور تمام شد' : 'کارتی برای مرور نیست.'}</div>${queue.length ? `<div class="sub">${right} از ${queue.length} درست بود</div>` : ''}
        <button class="btn block" data-back style="margin-top:20px;max-width:420px">بستن</button></div>`;
      const w = queue[i];
      const front = reverse ? `<div style="font-size:26px;font-weight:800">${esc(w.fa)}</div>` : `<div class="ltr" style="font-size:32px;font-weight:800;text-align:center">${germanHTML(w)}</div>`;
      const back = reverse ? `<div class="ltr" style="font-size:26px;font-weight:800;text-align:center">${germanHTML(w)}</div>` : `<div style="font-size:21px">${esc(w.fa)}</div>`;
      const ex = (w.examples && w.examples[0]) ? {de:w.examples[0].de, fa:w.examples[0].fa} : (w.example ? {de:w.example, fa:w.exampleFa} : null);
      return `<div class="nav small"><div class="side"><button class="link" data-back>بستن</button></div><h1>مرور</h1><div class="side"></div></div>
        <div class="scroll" style="display:flex;flex-direction:column">
          <div class="progress"><i style="width:${Math.round(i/queue.length*100)}%"></i></div>
          <div class="sub" style="text-align:center;margin-top:6px">${i+1} از ${queue.length} · جعبه ${boxOf(w.id)}</div>
          <div class="flash" id="flash">${front}${speakBtn(display(w))}
            ${flipped ? `<hr>${back}${w.plural ? `<div class="sub">جمع: <span class="ltr" style="display:inline-block">${esc(w.plural)}</span></div>` : ''}
              ${ex ? `<div style="font-size:14px"><div class="ltr" style="font-style:italic;text-align:center">${esc(ex.de)}</div>${ex.fa?`<div class="sub">${esc(ex.fa)}</div>`:''}</div>` : ''}` : '<div class="sub">برای دیدن پاسخ بزن</div>'}
          </div>
          <div style="flex:1;min-height:20px"></div>
          ${flipped ? `<div style="display:flex;gap:12px"><button class="btn red" id="no" style="flex:1">✕ بلد نبودم</button><button class="btn green" id="ok" style="flex:1">✓ بلد بودم</button></div>`
            : `<button class="btn ghost block" id="show">نمایش پاسخ</button>`}
        </div>`;
    },
    bind: el => {
      const f = el.querySelector('#flash'); if (f) f.onclick = e => { if (!e.target.closest('[data-speak]') && !flipped) { flipped = true; render(); } };
      const s = el.querySelector('#show'); if (s) s.onclick = () => { flipped = true; render(); };
      const go = ok => { answer(queue[i].id, ok); if (ok) right++; flipped = false; i++; render(); };
      const o = el.querySelector('#ok'); if (o) o.onclick = () => go(true);
      const n = el.querySelector('#no'); if (n) n.onclick = () => go(false);
    }
  });
}

render();
</script>
